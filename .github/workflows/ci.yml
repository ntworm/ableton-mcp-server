name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: lint + types + tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install mypy

      - name: Ruff
        run: python -m ruff check ableton_mcp_server AbletonMCPServer_RemoteScript scripts tests

      - name: Mypy strict
        run: python -m mypy --strict ableton_mcp_server

      - name: Pytest
        run: python -m pytest -q --tb=line

      - name: Coverage gate
        run: python scripts/coverage_check.py
