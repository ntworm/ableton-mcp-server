<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Groove Brain</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="handoff">
      <p class="eyebrow">GROOVE BRAIN</p>
      <h1>Abra o painel no celular</h1>
      <p id="status">Autenticando helper local…</p>
      <section id="controls" hidden>
        <div class="qr" id="qr"></div>
        <p class="url">ou digite <code id="url"></code></p>
        <p class="note">
          Feche esta janela para voltar ao Live. O groove que você escolher no
          celular será escrito no slot que abriu este painel.
        </p>
        <button id="done">Fechar e escolher no celular</button>
        <button id="cancel" class="secondary">Cancelar</button>
      </section>
      <pre id="error" role="alert"></pre>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
